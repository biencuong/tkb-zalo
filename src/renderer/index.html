<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'">
<title>TKB Zalo</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="vo">
  <aside id="ben">
    <div id="hieu">
      <button class="chu" id="ve-nha" title="Về trang chủ">
        <div class="ten">TKB Zalo</div>
        <div class="phu">Gửi thời khoá biểu qua Zalo</div>
      </button>
      <button class="nha-mini" id="ve-nha-mini" title="Về trang chủ" aria-label="Về trang chủ">◆</button>
      <button id="thu-gon" title="Thu gọn thanh bên (Ctrl+B)" aria-label="Thu gọn thanh bên">«</button>
    </div>
    <nav id="dieu-huong"></nav>
    <div id="ben-chan">
      <div class="chan-hang">
        <button class="chip-zalo n-xam" data-chip-zalo title="Kết nối Zalo">
          <span class="cz-bd">○</span><span class="cz-chu">Nối Zalo</span></button>
      </div>
      <div class="chan-hang">
        <button class="chip-ban" id="ban-app" title="Bấm để kiểm tra cập nhật">
          <span class="cb-chu">v…</span></button>
      </div>
    </div>
  </aside>
  <main id="chinh">
    <button id="nhip-zalo" class="tat" title="Zalo: chưa kết nối" aria-label="Trạng thái kết nối Zalo">
      <span class="nz-tim"></span><span class="nz-chu">Zalo</span>
    </button>
    <div class="wrap" id="noi-dung"></div>
  </main>
</div>

<div class="phu-man" id="phu-man"><div class="hop" id="hop"></div></div>
<div id="thong-bao"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
