<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Vẽ ảnh thời khoá biểu</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  /*
   * Ảnh gửi qua Zalo, xem trên ĐIỆN THOẠI là chính.
   * Ba điều quyết định đọc được hay không:
   *   1. Bỏ cột và hàng rỗng — ít cột thì cột rộng, chữ to ra, không phải cố nhồi.
   *   2. Một bảng duy nhất, buổi sáng và chiều ngăn bằng một hàng mỏng, khỏi lặp hàng tiêu đề.
   *   3. Chiều cao chạy theo nội dung, không ép tỉ lệ — ảnh giữ đúng dáng tự nhiên, không co kéo.
   */
  :root{
    --bg:#F0EEE6; --card:#FFFFFF; --ink:#1F1E1D; --muted:#655F59; --line:#E4E0D6;
    --accent:#D97757; --accent-ink:#9C4420; --accent-soft:#F7E9E1; --chim:#FBFAF6;
  }
  *{box-sizing:border-box}
  html{overflow:hidden}
  body{
    margin:0;width:1080px;background:var(--bg);color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  #khung{padding:24px}
  .the{
    background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 2px 12px rgba(31,30,29,.06);
  }

  /* ---------- Đầu ảnh ---------- */
  .dau{padding:24px 28px 20px;border-top:7px solid var(--accent);border-bottom:1px solid var(--line)}
  .truong{
    font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;font-size:27px;font-weight:600;
    color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;
  }
  h1{
    font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;font-size:52px;font-weight:700;
    margin:0;line-height:1.1;letter-spacing:.005em;
  }
  .hang-the{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .the-nho{
    font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;font-size:25px;font-weight:600;
    background:var(--chim);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:6px 18px;line-height:1.25;
  }
  .the-nho.chinh{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  .the-nho b{color:var(--accent-ink);font-weight:700}

  /* ---------- Lưới tiết ---------- */
  .than{padding:22px 28px 6px}
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  th,td{border:1px solid var(--line);text-align:center;vertical-align:middle;padding:0}
  thead th{
    background:var(--chim);font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;
    font-size:26px;font-weight:600;color:var(--muted);height:56px;letter-spacing:.02em;
  }
  col.cot-tiet{width:92px}
  tbody th{
    background:var(--chim);font-family:"JetBrains Mono",monospace;font-size:25px;font-weight:600;
    color:var(--muted);
  }
  tbody td{padding:8px 9px;height:86px}
  /* Hàng ngăn buổi: mỏng, rõ, thay cho cả một khối tiêu đề riêng */
  tr.ngan td{
    background:var(--accent-soft);border-left-color:var(--accent-soft);border-right-color:var(--accent-soft);
    height:auto;padding:9px 16px;text-align:left;
    font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;font-size:26px;font-weight:700;
    color:var(--accent-ink);letter-spacing:.04em;text-transform:uppercase;
  }
  .mon{
    font-size:29px;font-weight:600;line-height:1.15;display:block;
    word-break:break-word;hyphens:none;
  }
  .phu-o{
    font-size:23px;color:var(--muted);line-height:1.2;display:block;margin-top:4px;
    word-break:break-word;
  }
  td.co{background:#fff}
  tbody tr.le td.co{background:var(--chim)}
  td.trong{background:repeating-linear-gradient(135deg,#fff,#fff 9px,#F7F5EF 9px,#F7F5EF 18px)}
  tbody tr.le td.trong{background:repeating-linear-gradient(135deg,var(--chim),var(--chim) 9px,#F2EFE8 9px,#F2EFE8 18px)}

  /* ---------- Chân ảnh ---------- */
  .chan{
    padding:16px 28px 20px;border-top:1px solid var(--line);background:var(--chim);
    display:flex;justify-content:space-between;align-items:center;gap:18px;
  }
  .tong{font-family:"Barlow Semi Condensed","Segoe UI",sans-serif;font-size:26px;font-weight:600;color:var(--muted)}
  .tong b{color:var(--accent-ink);font-size:32px;font-weight:700}
  .ghi{font-size:21px;color:var(--muted);text-align:right;line-height:1.35}
  .rong{padding:46px;text-align:center;color:var(--muted);font-size:27px}
</style>
</head>
<body>
<div id="khung"></div>
<script>
const TEN_THU = { 2: "Thứ 2", 3: "Thứ 3", 4: "Thứ 4", 5: "Thứ 5", 6: "Thứ 6", 7: "Thứ 7", 8: "CN" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/**
 * Dựng MỘT bảng cho cả ngày. Buổi ngăn nhau bằng một hàng mỏng.
 * Cột nào cả tuần không có tiết thì bỏ hẳn — còn ít cột thì cột rộng ra, chữ to, dễ đọc trên điện thoại.
 */
function veBang(tiet, hienGi) {
  if (!tiet.length) return '<div class="rong">Không có tiết nào trong thời khoá biểu này.</div>';

  const thuCo = [...new Set(tiet.map((t) => Number(t.thu)))].sort((a, b) => a - b);
  const buoiCo = ["S", "C"].filter((b) => tiet.some((t) => t.buoi === b));
  const tra = new Map();
  for (const t of tiet) tra.set(t.buoi + "|" + t.thu + "|" + t.tiet, t);

  let h = '<table><colgroup><col class="cot-tiet">'
    + thuCo.map(() => "<col>").join("")
    + "</colgroup><thead><tr><th>Tiết</th>"
    + thuCo.map((t) => "<th>" + (TEN_THU[t] || "Thứ " + t) + "</th>").join("")
    + "</tr></thead><tbody>";

  let soHang = 0;
  for (const b of buoiCo) {
    const cuaBuoi = tiet.filter((t) => t.buoi === b);
    // Chỉ vẽ tới tiết cuối CÓ HỌC, không kéo dài 5 tiết cho đủ khuôn
    const tietCuoi = Math.max(...cuaBuoi.map((t) => Number(t.tiet)));
    h += '<tr class="ngan"><td colspan="' + (thuCo.length + 1) + '">'
       + (b === "S" ? "Buổi sáng" : "Buổi chiều") + "</td></tr>";
    for (let i = 1; i <= tietCuoi; i++) {
      soHang += 1;
      h += '<tr class="' + (soHang % 2 === 0 ? "le" : "") + '"><th>' + i + "</th>";
      for (const t of thuCo) {
        const o = tra.get(b + "|" + t + "|" + i);
        if (!o) { h += '<td class="trong"></td>'; continue; }
        const phu = hienGi === "lop" ? (o.ma_gv || "") : (o.lop || "");
        h += '<td class="co"><span class="mon">' + esc(o.mon) + "</span>"
           + (phu ? '<span class="phu-o">' + esc(phu) + "</span>" : "") + "</td>";
      }
      h += "</tr>";
    }
  }
  return h + "</tbody></table>";
}

/**
 * Vẽ một thời khoá biểu rồi trả về chiều cao thật của trang (px CSS).
 * d = { loai:'gv'|'lop', ten, phu, truong, so_tkb, ngay, nam_hoc, hoc_ky,
 *       tiet:[{thu,buoi,tiet,mon,lop,ma_gv}], gom:'ca_ngay'|'sang'|'chieu' }
 */
window.veTKB = async function (d) {
  const tiet = (d.tiet || []).filter((t) => (d.gom === "sang" ? t.buoi === "S" : d.gom === "chieu" ? t.buoi === "C" : true));

  const the = [];
  the.push('<span class="the-nho chinh">Thời khoá biểu <b>số ' + esc(d.so_tkb) + "</b></span>");
  if (d.ngay) the.push('<span class="the-nho">Từ <b>' + esc(d.ngay) + "</b></span>");
  if (d.hoc_ky) the.push('<span class="the-nho">Học kỳ ' + esc(d.hoc_ky) + "</span>");
  if (d.nam_hoc) the.push('<span class="the-nho">Năm học ' + esc(d.nam_hoc) + "</span>");
  if (d.phu) the.push('<span class="the-nho">' + esc(d.phu) + "</span>");

  document.getElementById("khung").innerHTML =
    '<div class="the"><div class="dau">'
    + (d.truong ? '<p class="truong">' + esc(d.truong) + "</p>" : "")
    + "<h1>" + esc(d.ten) + "</h1>"
    + '<div class="hang-the">' + the.join("") + "</div>"
    + '</div><div class="than">' + veBang(tiet, d.loai) + "</div>"
    + '<div class="chan"><span class="tong">Tổng <b>' + tiet.length + "</b> tiết/tuần</span>"
    + '<span class="ghi">' + esc(d.ghi_chan || "Ảnh do phần mềm TKB Zalo tạo tự động") + "</span></div></div>";

  // Chờ phông nạp xong rồi mới báo chiều cao — nếu không, chữ sẽ nhảy sau khi chụp
  const phong = [
    '700 52px "Barlow Semi Condensed"', '600 27px "Barlow Semi Condensed"',
    '600 29px "Inter"', '400 23px "Inter"', '600 25px "JetBrains Mono"',
  ];
  try { await Promise.all(phong.map((f) => document.fonts.load(f, "ÀĂÂĐÊÔƠƯàăâđêôơư"))); } catch (e) { /* */ }
  try { await document.fonts.ready; } catch (e) { /* */ }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return Math.ceil(document.documentElement.scrollHeight);
};
</script>
</body>
</html>
